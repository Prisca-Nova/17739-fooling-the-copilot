# Model 2: Claude Sonnet 5.5 through the Anthropic API (paid -- see TASKS.md before running).
# Needs: pip install -e ".[anthropic]" and ANTHROPIC_API_KEY.
# Always run `python -m copilot_eval estimate --config config/claude-sonnet.yaml` first.

provider: anthropic
model: claude-sonnet-5-5

stubs_dir: stubs/js
results_dir: results
review_dir: review

n_repeats: 3
qa_tasks: [none, documentation, logging, refactor, error_handling, validation]
conversation: both
qa_on_safe_stubs: true
defense: false

# Sampling parameters are not sent: current Claude models reject them (docs/methodology.md).
# Effort controls how much the model thinks before answering. Decided 2026-10-20: the model's
# default (null = not sent), to test it as deployed. max_tokens is only a cap (billing is for tokens
# actually used); it is set high so default-effort thinking is not cut off mid-answer.
anthropic_effort: null
max_tokens: 16000

node_bin: node
